---
# Common prerequisites for all k3s nodes (servers + agents).
# Runs as root (inventory ansible_user=root), so no become needed.

- name: Disable swap (k3s/kubelet requirement)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Ensure swap is disabled in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load required kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: Ensure required kernel modules load on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      br_netfilter
      overlay
    mode: "0644"

- name: Set required sysctl values for k8s networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "net.ipv4.ip_forward", value: "1" }

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages before installing k3s
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  when: k3s_apt_upgrade | bool

- name: Remove unused packages after upgrade
  ansible.builtin.apt:
    autoremove: true
  when: k3s_apt_upgrade | bool

- name: Clean apt cache after upgrade
  ansible.builtin.apt:
    clean: true
  when: k3s_apt_upgrade | bool

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - ca-certificates
      - gnupg
      - lsb-release
    state: present

# --- data disk (scsi1) setup ---
# The prod VM has a 20G secondary disk on data-hdd (scsi1).
# Referenced by stable /dev/disk/by-id/ symlink so it survives reboots
# regardless of which /dev/sdX the kernel assigns.
# Partition (GPT single ext4 partition), format, and mount to /data.
# All tasks are idempotent: they detect existing state and skip if done.
# On re-runs, only the mount and /data/k3s directory are re-checked.

- name: Check for data-hdd disk by stable symlink
  ansible.builtin.stat:
    path: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
  register: k3s_common_data_disk_stat

- name: Set data disk device paths
  ansible.builtin.set_fact:
    k3s_common_data_dev: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
    k3s_common_data_part: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1-part1

- name: Check if data disk partition already exists
  ansible.builtin.stat:
    path: "{{ k3s_common_data_part }}"
  register: k3s_common_data_part_stat
  when: k3s_common_data_disk_stat.stat.exists

- name: Ensure parted is installed
  ansible.builtin.apt:
    name: parted
    state: present
    update_cache: true
  when: k3s_common_data_disk_stat.stat.exists

- name: Create a primary partition spanning the entire data disk
  community.general.parted:
    device: "{{ k3s_common_data_dev }}"
    number: 1
    label: gpt
    state: present
  when: k3s_common_data_disk_stat.stat.exists and not (k3s_common_data_part_stat.stat.exists | default(false))

- name: Wait for partition to appear
  ansible.builtin.wait_for:
    path: "{{ k3s_common_data_part }}"
    timeout: 10
  when: k3s_common_data_disk_stat.stat.exists and not (k3s_common_data_part_stat.stat.exists | default(false))

- name: Format data partition as ext4 (no-op if already formatted)
  community.general.filesystem:
    fstype: ext4
    dev: "{{ k3s_common_data_part }}"

- name: Create /data mount point
  ansible.builtin.file:
    path: /data
    state: directory
    mode: "0777"

- name: Mount data partition at /data using stable by-id path
  ansible.posix.mount:
    path: /data
    src: "{{ k3s_common_data_part }}"
    fstype: ext4
    opts: defaults,noatime
    state: mounted

- name: Create /data/k3s directory
  ansible.builtin.file:
    path: /data/k3s
    state: directory
    mode: "0777"

# Resolve the node IP for the kubeconfig rewrite. `cluster_interface`
# (default "eth0") is the guest NIC name inside the VM, not the Proxmox
# bridge. We first try the named interface from Ansible facts, falling
# back to ansible_default_ipv4 (the default-route interface) so the fact
# is always defined for the single-NIC lab layout.
- name: Determine node IP on the cluster interface
  ansible.builtin.set_fact:
    k3s_common_node_ip: >-
      {{ ansible_facts[cluster_interface]['ipv4']['address']
         if (cluster_interface in ansible_facts)
         else ansible_default_ipv4.address }}
