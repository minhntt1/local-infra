# Values for the k8s-gh-runner parent chart.
# The ARC runner scale set is a Helm dependency; its values are nested
# under the dependency name `gha-runner-scale-set` (Helm auto-scoping).

gha-runner-scale-set:
  githubConfigUrl: "https://github.com/minhntt1/local-infra"
  githubConfigSecret: arc-github-config
  maxRunners: 5
  minRunners: 0
  runnerScaleSetName: k8s-gh-runner
  runnerGroup: "default"
  scaleSetLabels:
    - "self-hosted"
    - "k8s"
  # Reference the ARC controller's ServiceAccount (deployed by the
  # arc-controller app in the same namespace) so the scale set chart can
  # create the manager RoleBinding without label-discovery.
  controllerServiceAccount:
    name: arc-controller-gha-rs-controller
    namespace: github-runners
  template:
    spec:
      containers:
        - name: runner
          env:
            - name: DEV_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liquibase-dev-db
                  key: password
            - name: PROD_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liquibase-prod-db
                  key: password
