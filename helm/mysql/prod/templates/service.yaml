apiVersion: v1
kind: Service
metadata:
  name: {{ include "mysql-prod.fullname" . }}
  labels:
    {{- include "mysql-prod.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3306
      protocol: TCP
      name: mysql
  selector:
    {{- include "mysql-prod.selectorLabels" . | nindent 4 }}