apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mysql-dev.fullname" . }}-config
  labels:
    {{- include "mysql-dev.labels" . | nindent 4 }}
data:
  my.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    [client]
    default-character-set=utf8mb4
