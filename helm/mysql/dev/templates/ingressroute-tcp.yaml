{{- if .Values.ingressRouteTCP.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "mysql-dev.fullname" . }}-tcp
  labels:
    {{- include "mysql-dev.labels" . | nindent 4 }}
spec:
  entryPoints:
    - mysql-dev
  routes:
    - match: HostSNI(`*`)
      services:
        - name: {{ include "mysql-dev.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
