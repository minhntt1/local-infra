replicaCount: 1

image:
  repository: ghcr.io/minhntt1/network-statistics
  tag: 771e824
  pullPolicy: IfNotPresent

imagePullSecret:
  enabled: false  # managed by SealedSecret; not stored in git
  registry: ghcr.io
  username: minhntt1

service:
  type: ClusterIP
  executorPort: 8080
  adminPort: 8081

persistence:
  enabled: false
  size: 1Gi
  storageClass: local-path

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

database:
  useSealed: true
  host: mysql-prod.prod.svc
  port: 3306
  quartzDatabase: quartz
  quartzUsername: quartz
  statisticDatabase: network_statistics
  statisticUsername: netstats

ingressRoute:
  enabled: true
