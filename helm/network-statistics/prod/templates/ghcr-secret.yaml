{{- if .Values.imagePullSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "network-statistics-prod.fullname" . }}-ghcr-secret
  labels:
    {{- include "network-statistics-prod.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "network-statistics-prod.imagePullSecret" . }}
{{- end }}