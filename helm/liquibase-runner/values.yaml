replicaCount: 1

image:
  repository: ghcr.io/actions/actions-runner
  tag: 2.336.0
  pullPolicy: IfNotPresent

runner:
  repoUrl: https://github.com/minhntt1/local-infra
  name: k8s-liquibase-runner
  labels: self-hosted,k8s,liquibase
  ephemeral: "true"
  workDir: /tmp/runner-work

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 384Mi

nodeSelector: {}
tolerations: []
